# Builds the Mira Remote phone app (debug APK) and uploads it as a workflow
# artifact. Read-only: no releases, no signing secrets (debug-signed APK for
# sideloading).

name: android-build

on:
  push:
    branches-ignore: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mira-remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mira-remote-${{ github.sha }}
          path: mira-remote.apk
          if-no-files-found: error
